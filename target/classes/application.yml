spring:
  application:
    name: menu-saas-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/menu_saas}
    username: ${DB_USER:menu_saas}
    password: ${DB_PASSWORD:menu_saas}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

server:
  port: ${PORT:8080}

app:
  jwt:
    # Generar con: openssl rand -base64 64
    secret: ${JWT_SECRET:Y2hhbmdlLW1lLWxvY2FsLW1lbnUtc2Fhcy1qd3Qtc2VjcmV0LXNlY3JldC1kZW1vLTIwMjYtMDgtMTg=}
    access-token-ttl-minutes: ${JWT_ACCESS_TTL:15}
    refresh-token-ttl-days: ${JWT_REFRESH_TTL:7}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8080}
  app-base-url: ${APP_BASE_URL:http://localhost:4200}
  upload-dir: ${UPLOAD_DIR:./uploads}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.menusaas: INFO